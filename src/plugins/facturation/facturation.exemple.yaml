# =============================================================================
#  Devis et facturation (plugin « facturation »)
# =============================================================================
#
#  Réglages propres à l'entreprise : page publique « Demander un devis »,
#  conditions et mentions des devis et factures. Les données (clients,
#  prestations, devis, factures) sont dans un document Grist dont la
#  structure est décrite dans src/plugins/facturation/README.md ; son adresse,
#  son identifiant et la clé d'API sont des secrets (.env ou assistant
#  d'installation) : GRIST_BASE_URL, GRIST_DOC_ID_FACTURATION,
#  GRIST_API_KEY_FACTURATION.
#
#  Tout est facultatif : une clé absente reprend la valeur par défaut.
# =============================================================================

# Adresse de la page publique « Demander un devis ».
adresse: /devis

# false = page fermée (message ci-dessous à la place du formulaire).
ouvert: true

textes:
  titre: 'Demander un devis'
  description: 'Décrivez votre besoin : vous recevez un devis détaillé, gratuit et sans engagement.'
  consentement: "J'accepte que ces informations servent à établir et suivre mon devis."
  confirmation: 'Merci ! Votre demande est bien arrivée : vous recevrez votre devis rapidement.'
  fermeTitre: 'Demandes de devis suspendues'
  fermeMessage: 'Les demandes en ligne sont momentanément fermées : contactez-nous directement.'

devis:
  # Durée de validité d'un devis, en jours.
  validiteJours: 30
  conditions: 'Devis gratuit. Pour l’accepter : le retourner daté et signé, précédé de la mention « Bon pour accord ».'

factures:
  # Délai de paiement, en jours après l'émission.
  delaiJours: 30
  conditions: "Pas d'escompte pour paiement anticipé. En cas de retard : pénalités au taux de trois fois le taux d'intérêt légal et, pour un client professionnel, indemnité forfaitaire de 40 € pour frais de recouvrement (art. L441-10 du Code de commerce)."
  modesPaiement: ['Virement', 'Chèque', 'Espèces', 'Carte bancaire']

# Mention de TVA (micro-entreprise en franchise de TVA).
tva: 'TVA non applicable, article 293 B du CGI'

# Coordonnées bancaires imprimées sur les factures (facultatif).
paiement:
  iban: ''
  bic: ''

# Numérotation : {annee} et {numero} (numéro dans l'année, sur 3 chiffres).
# Ne changez pas le modèle des factures en cours d'année : la numérotation doit
# rester continue et chronologique.
numerotation:
  devis: 'D-{annee}-{numero}'
  factures: 'F-{annee}-{numero}'
