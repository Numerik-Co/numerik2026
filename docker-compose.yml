services:
  web:
    build: .
    image: numerik2026:latest
    container_name: numerik2026
    restart: unless-stopped

    # Secrets Grist (et autres) — fichier .env présent sur le VPS, hors dépôt
    env_file:
      - .env

    # Le conteneur n'est joignable qu'en local :
    # un reverse proxy (nginx / Traefik) gère le vrai domaine + HTTPS devant.
    ports:
      - "127.0.0.1:4321:4321"

    # Seules données écrites sur disque : les comptes de l'espace bénévoles
    # (auth à plat, un YAML par compte — cf. docs/auth.md). Tout le reste va
    # dans Grist. Le dossier ./data du VPS survit aux redéploiements.
    environment:
      - AUTH_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
