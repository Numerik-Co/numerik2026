# Publication d'une version du modèle, déclenchée par un tag `vX.Y.Z` poussé
# sur GitHub (créé par `npm version …` sur master, cf. docs/mise-a-jour.md) :
#
#  1. vérifications : le tag correspond à package.json et à un commit de
#     master, puis la CI complète (ci.yml) ;
#  2. image Docker publiée sur GitHub Container Registry :
#     ghcr.io/numerik-co/numerik2026:X.Y.Z, :X.Y et :latest ;
#  3. « Release » GitHub : notes = commits depuis la version précédente,
#     archive des sources (installations Node seul) fournie par GitHub.

name: Publication d'une version

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  tag:
    name: Tag conforme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Le tag correspond à package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mais package.json indique $version. Créer les versions avec « npm version »."
            exit 1
          fi

      - name: Le tag est sur master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Le commit de $GITHUB_REF_NAME n'est pas sur master : une version se publie depuis master."
            exit 1
          fi

  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml

  image:
    name: Image Docker (ghcr.io)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les noms d'image sont en minuscules (l'organisation s'écrit Numerik-Co).
      - name: Nom de l'image
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/numerik2026" >> "$GITHUB_OUTPUT"

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=numerik2026
            org.opencontainers.image.description=Site et espace bénévoles pour associations (Astro + Node)

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release GitHub
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notes de version
        run: |
          precedent=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/numerik2026:${GITHUB_REF_NAME#v}"
          {
            echo "## Mettre à jour"
            echo
            echo "- **Docker** : \`./update.sh ${GITHUB_REF_NAME}\` (image \`$image\`)."
            echo "- **Node seul** : \`./update.sh ${GITHUB_REF_NAME}\` (archive des sources ci-dessous)."
            echo
            echo "Le contenu de l'association (\`src/content/\`, \`data/\`, \`.env\`) n'est jamais touché ; le site se reconstruit au redémarrage. Détail : [docs/mise-a-jour.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/mise-a-jour.md)."
            echo
            if [ -n "$precedent" ]; then
              echo "## Changements depuis $precedent"
              echo
              git log --no-merges --pretty='- %s' "$precedent..$GITHUB_REF_NAME"
            else
              echo "## Première version publiée"
            fi
          } > notes.md
          cat notes.md

      - name: Création de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
